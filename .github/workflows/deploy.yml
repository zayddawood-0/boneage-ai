name: Deploy

# Fires after the CI workflow finishes on main, and only deploys if that run
# passed (see docs/tasks.md Phase 5 and README.md#deployment-setup-vercel--render--github-actions).
# Vercel's and Render's own "auto-deploy on push" must be turned OFF in each
# dashboard so this workflow is the only thing that triggers a deploy.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # The frontend's API base URL (VITE_API_BASE_URL) is read from the
      # Vercel project's own Production env var, fetched by `vercel pull`
      # above — see README.md's setup checklist. Nothing to pass here.
      - name: Build frontend via Vercel CLI
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-backend:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Call the Render deploy hook
        # render.yaml (repo root) defines the service itself (start command,
        # Alembic migrations + demo seed on deploy, env vars) — this just
        # tells Render's already-configured service to redeploy.
        run: |
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
