name: Deploy

# Fires after the CI workflow finishes on main, and only deploys if that run
# passed (see docs/tasks.md Phase 5 and README.md#deployment-setup-vercel--github-actions).
# Both Vercel projects' own "auto-deploy on push" must be turned OFF in their
# dashboards so this workflow is the only thing that triggers a deploy.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  migrate-backend-db:
    name: Apply backend DB migrations
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install migration dependencies
        # requirements.txt already has alembic, sqlalchemy, psycopg, pydantic-settings
        run: pip install -r backend/requirements.txt

      - name: Apply Alembic migrations against the production database
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      - name: Re-seed demo users + sample cases
        # Idempotent (matches existing rows by email/case code, see
        # backend/scripts/seed_demo_data.py) — safe to run on every deploy.
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/seed_demo_data.py

  deploy-frontend:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Deliberately run from the repo root, not `working-directory:
      # frontend` — Vercel CLI combines the project's Root Directory setting
      # ("frontend") with the directory it's invoked from, so running it
      # from inside frontend/ produces an invalid "frontend/frontend" path
      # (reproduced empirically; see docs/tasks.md Phase 7). Running from
      # the repo root and letting Root Directory alone resolve the
      # subdirectory is the combination that actually works.
      - name: Pull Vercel project settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # The frontend's API base URL (VITE_API_BASE_URL) is read from the
      # Vercel project's own Production env var, fetched by `vercel pull`
      # above — see README.md's setup checklist. Nothing to pass here.
      - name: Build frontend via Vercel CLI
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-backend:
    name: Deploy backend to Vercel
    runs-on: ubuntu-latest
    needs: migrate-backend-db
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Separate Vercel project from the frontend (Root Directory: backend/,
      # Python Function at api/index.py — see vercel.json and
      # README.md#deployment-setup-vercel--github-actions). Same org/token,
      # different project id. Run from the repo root, not `working-directory:
      # backend` — see the matching comment in deploy-frontend above for why.
      - name: Pull Vercel project settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build backend via Vercel CLI
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
