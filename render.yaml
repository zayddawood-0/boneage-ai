# Render Blueprint for the BoneAge AI backend + model service (see
# docs/architecture.md#deployment-notes-hackathon-demo and
# README.md#deployment-setup-vercel--render--github-actions).
#
# Deploys are triggered only via .github/workflows/deploy.yml, which calls
# this service's deploy hook (RENDER_DEPLOY_HOOK_URL) after CI passes on
# main — turn OFF "Auto-Deploy" for this service in the Render dashboard so
# a push to main doesn't also trigger Render's own git-push deploy.
#
# SQLite lives on this service's local (ephemeral) disk — Render's free tier
# has no persistent disk, so the DB resets on every redeploy. The start
# command re-runs migrations and re-seeds demo data each time, which is
# acceptable for a hackathon demo (see README.md).
services:
  - type: web
    name: boneage-ai-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # 1. Best-effort checkpoint download (never fails the deploy — falls
    #    back to the mock predictor automatically if it fails or is unset).
    # 2. Apply migrations, re-seed demo data, then start the API. Inference
    #    runs on CPU (no GPU on Render's free tier).
    startCommand: >-
      python scripts/download_checkpoint.py;
      alembic upgrade head &&
      python scripts/seed_demo_data.py &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./boneage.db
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: ML_CHECKPOINT_PATH
        value: ../ml/checkpoints/best_model.pt
      - key: ML_CONFIG_PATH
        value: ../ml/config/config.yaml
      - key: REFERENCE_TABLE_PATH
        value: ./data/reference_tables/greulich_pyle_sd_reference.json
      # Set manually in the Render dashboard (not committed — see README.md):
      - key: CORS_ORIGIN # the Vercel deployment URL, e.g. https://boneage-ai.vercel.app
        sync: false
      - key: CHECKPOINT_DOWNLOAD_URL # optional: URL to a trained checkpoint; blank = mock predictor
        sync: false
      - key: OPENAI_API_KEY # optional: unset = template doctor-note fallback
        sync: false
